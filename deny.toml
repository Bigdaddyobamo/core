# cargo-deny configuration
# Security and dependency policy for the workspace.
#
# Written for the cargo-deny 0.20 schema. Several keys used by older versions
# (`vulnerability`, `notice`, `unlicensed`, `copyleft`, `allow-osi-fsf-free`,
# `default`) were removed upstream: vulnerabilities and unlicensed crates are
# now always denied, so they no longer need to be configured.

[graph]
all-features = true

[advisories]
db-path = "~/.cargo/advisory-db"
# Flag unmaintained crates anywhere in the dependency graph.
unmaintained = "all"
# Crates yanked from crates.io.
yanked = "warn"
# Advisory IDs to ignore, with a comment explaining each.
ignore = []

[licenses]
# Licenses that are acceptable for this project and everything it links.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Unlicense",
    "MPL-2.0",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "Zlib",
    "CDLA-Permissive-2.0",
]
# Confidence required when inferring a license from its text.
confidence-threshold = 0.8

[bans]
# Duplicate versions of a crate are reported but not fatal.
multiple-versions = "warn"
allow = []
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
